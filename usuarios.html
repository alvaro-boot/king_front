<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - King Perfum</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <h2><a href="ventas.html" class="logo-link">King Perfum</a></h2>
      <span id="user-name" class="user-badge"></span>
    </div>
    <nav class="main-nav">
      <a href="ventas.html" class="nav-link">Ventas</a>
      <a href="stock.html" class="nav-link">Stock</a>
      <a href="clientes.html" class="nav-link">Clientes</a>
      <a href="reportes.html" class="nav-link">Reportes</a>
      <a href="usuarios.html" class="nav-link active">Usuarios</a>
      <button class="nav-btn btn-logout" id="btn-logout">Cerrar Sesión</button>
    </nav>
  </header>

  <main class="app-main">
    <div class="section-header">
      <h3>Registro de Usuarios (Admin)</h3>
    </div>

    <form id="usuarios-form" class="form-card">
      <h4>Nuevo Usuario</h4>
      <div class="form-row">
        <div class="form-group">
          <label for="usuario-nombre-completo">Nombre Completo</label>
          <input type="text" id="usuario-nombre-completo" required maxlength="50" />
        </div>
        <div class="form-group">
          <label for="usuario-usuario">Usuario</label>
          <input type="text" id="usuario-usuario" required maxlength="50" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="usuario-contraseña">Contraseña</label>
          <input type="password" id="usuario-contraseña" required maxlength="200" />
        </div>
        <div class="form-group">
          <label for="usuario-rol">Rol</label>
          <select id="usuario-rol" required></select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrar</button>
        <button type="button" class="btn btn-secondary" id="btn-cancelar-usuario">Cancelar</button>
      </div>

      <div id="usuarios-error" class="error-message"></div>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
